; RTAB-Map core parameters. Override with slam3d.launch.py config:=/path/file.ini.
; Launch selects Grid/Sensor=0 (LiDAR) or 1 (rgbd_only). Other values live here.
[Core]
Rtabmap/DetectionRate=2.0
RGBD/NeighborLinkRefining=true
Vis/MaxDepth=3.5
Vis/MinInliers=15
Icp/PointToPlane=true
Icp/VoxelSize=0.1
Icp/PointToPlaneK=20
Icp/RangeMin=0.5
Icp/RangeMax=10.0
Grid/3D=true
Grid/RangeMin=0.3
; Conservative initial indoor range for either geometry source.
Grid/RangeMax=3.5
Grid/CellSize=0.05
Grid/DepthDecimation=2
Grid/NoiseFilteringRadius=0.1
Grid/NoiseFilteringMinNeighbors=5
; Keep full-height geometry. Tune these only to crop the map vertically.
Grid/MaxObstacleHeight=0.0
