; RTAB-Map core parameters. Override with slam3d.launch.py config:=/path/file.ini.
; Launch selects Grid/Sensor=0 (LiDAR) or 1 (rgbd_only). Other values live here.
[Core]
Rtabmap/DetectionRate=2.0
RGBD/NeighborLinkRefining=true
Vis/MaxDepth=3.5
Vis/MinInliers=15
Mem/LaserScanNormalK=20
Icp/PointToPlane=true
Icp/VoxelSize=0.1
Icp/PointToPlaneK=20
Icp/PointToPlaneRadius=0
Icp/RangeMin=0.5
Icp/RangeMax=10.0
; As rtabmap_examples' 3D LiDAR example (vlp16.launch.py) of RTAB-Map 0.21.1. The
; default correspondence distance (0.1) is no larger than the voxels.
Icp/MaxCorrespondenceDistance=1.0
Icp/Iterations=10
Icp/Epsilon=0.001
Icp/OutlierRatio=0.7
Icp/CorrespondenceRatio=0.2
Icp/MaxTranslation=3
Grid/3D=true
; Clear free space along each ray (per-node OctoMap): ghost obstacles get erased.
Grid/RayTracing=true
; The Livox reports missing returns as (0,0,0), ~16% of each scan.
Grid/RangeMin=0.5
; The LiDAR maps cleanly to 10 m; RealSense depth is cut at 3.5 m by the camera
; node (slam_camera.yaml depth_max) in rgbd_only mode.
Grid/RangeMax=10.0
Grid/CellSize=0.05
Grid/DepthDecimation=2
Grid/NoiseFilteringRadius=0.1
Grid/NoiseFilteringMinNeighbors=5
; Up to 1.5 m above base_link: the ceiling would otherwise fill the 2D /map that
; Nav2 plans on (0.21.1 has no Grid/MinObstacleHeight).
Grid/MaxObstacleHeight=1.5
